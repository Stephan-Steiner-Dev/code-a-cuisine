<section>
    <div>
        <div>
            <button (click)="navigate('/cookbook')" class="back-btn">
                <img src="assets/shared-icons/arrow.png" alt="">
                Cookbook
            </button>

            <app-button class="generate-btn" (click)="navigate('/select-ingredients')" text="Generate a Recipe">
            </app-button>
        </div>

        <h1 class="cuisine-card" *ngIf="recipes?.length"
            [style.--bg-desktop]="'url(' + dataService.cookbookCollection.images[recipes[0].cuisine] + ')'"
            [style.--bg-mobile]="'url(' + dataService.cookbookCollection.imagesMobile[recipes[0].cuisine] + ')'">
            {{ recipes[0].cuisine }}
        </h1>

        <article *ngFor="let r of pagedRecipes; let i = index" (click)="navigateToRecipe(r)"
            [ngClass]="{ 'even-article': i % 2 === 0, 'odd-article': i % 2 !== 0 }">
            <div>
                <div>
                    <p>{{ (currentPage - 1) * pageSize + i + 1 }}.</p>
                </div>

                <div>
                    <div>
                        <img src="assets/images/preferences/clock.png" alt="">
                        <p>Cooking time: {{ r?.cookingtime ?? '' }}</p>
                    </div>
                    <p>{{ r?.title ?? '' }}</p>
                </div>
            </div>

            <div>
                <p>{{ r?.diet ?? '' }}</p>
                <p>
                    <img class="heart-icon" src="assets/shared-icons/heart.png" alt="">
                    {{ r?.likes ?? 0 }}
                </p>
            </div>
        </article>
        <div class="pagination" *ngIf="recipes?.length && totalPages > 1">
            <button class="page-btn" (click)="prevPage()" [disabled]="currentPage === 1">
                back
            </button>

            <div class="page-info">
                Seite {{ currentPage }} / {{ totalPages }}
            </div>

            <button class="page-btn" (click)="nextPage()" [disabled]="currentPage === totalPages">
                next
            </button>
        </div>
    </div>
</section>
